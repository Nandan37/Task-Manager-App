<h2 mat-dialog-title>Add New Task</h2>
<form [formGroup]="taskForm" (ngSubmit)="onSubmit()" mat-dialog-content>
  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" placeholder="Enter title" />
    <mat-error *ngIf="taskForm.get('title')?.hasError('pattern')">
      Enter only Alphabets
    </mat-error>
    <mat-error *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.invalid">
      Title is required
    </mat-error>
  </mat-form-field>

 <mat-form-field appearance="fill" class="w-100 mb-3">
  <mat-label>Due Date</mat-label>
  <input matInput [matDatepicker]="picker" formControlName="dueDate" />
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>

  <mat-error *ngIf="taskForm.get('dueDate')?.touched && taskForm.get('dueDate')?.invalid">
    Due Date is required
  </mat-error>
</mat-form-field>

  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>Priority</mat-label>
    <mat-select formControlName="priority">
      <mat-option value="Low">Low</mat-option>
      <mat-option value="Medium">Medium</mat-option>
      <mat-option value="High">High</mat-option>
    </mat-select>
    <mat-error *ngIf="taskForm.get('priority')?.touched">
      Priority is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="w-100 mb-3">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option value="Not Started">Not Started</mat-option>
      <mat-option value="In Progress">In Progress</mat-option>
      <mat-option value="Completed">Completed</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="taskForm.invalid">
      Add Task
    </button>
  </mat-dialog-actions>
</form>
