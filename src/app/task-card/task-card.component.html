<div class="task-bar d-flex align-items-center justify-content-between p-3 rounded shadow-sm mb-3" [class.completed]="task.completed">
  
  
  <!-- <div class="form-check me-3">
    <input type="checkbox" class="form-check-input" [checked]="task.completed" (change)="onToggle()" />
  </div> -->

  
  <div class="flex-grow-1">
    <h6 class="mb-1 fw-semibold">{{ task.title }}</h6>
    <small class="text-muted">Due: {{ task.dueDate | date }}</small>
  </div>

  
  <div class="d-flex align-items-center gap-3 ms-3">
    <span class="badge rounded-pill" style="color: black;">
      {{ task.priority }}
    </span>
    

    <div>
      <span class="me-2">Status:</span>

    <select
      class="form-select form-select-sm"
      [(ngModel)]="task.status"
      (ngModelchange)="updateStatus(task.status)"
    >
      <option value="Not Started">Not Started</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>
      
    </div>

    <button (click)="onDeleteConfirm()" class="btn btn-sm btn-outline-danger border-0">
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>
